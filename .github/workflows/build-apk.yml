name: Build Cute Fantasy RPG Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application with Vite
        run: npm run build

      - name: Check / Initialize Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Cute-Fantasy-RPG-debug.apk

      - name: Build Android Release APK (Unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || true
          cd ..
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/Cute-Fantasy-RPG-release.apk
            echo "Release APK generated (unsigned). Sign with your production keystore before publishing to Google Play." > artifacts/RELEASE_INFO.txt
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/Cute-Fantasy-RPG-release.apk
          else
            echo "Release APK build skipped or requires keystore configuration." > artifacts/RELEASE_INFO.txt
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cute-Fantasy-RPG-debug
          path: artifacts/Cute-Fantasy-RPG-debug.apk
          if-no-files-found: error

      - name: Upload Release APK & Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cute-Fantasy-RPG-release
          path: |
            artifacts/Cute-Fantasy-RPG-release.apk
            artifacts/RELEASE_INFO.txt
          if-no-files-found: warn
